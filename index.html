<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>درب — منصّة تنسيق الزيارات الميدانية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-day">

  <!-- الخلفية التفاعلية Ambient Background -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-orb o1"></div>
    <div class="ambient-orb o2"></div>
    <div class="ambient-orb o3"></div>
  </div>

  <div class="app-shell">
    <!-- الشريط الجانبي Sidebar -->
    <aside class="sidebar">
      <div class="horizon-wrap" id="horizonWrap">
        <!-- SVG أفق سماء عُمان التفاعلي حسب الوقت -->
        <svg class="horizon-svg" viewBox="0 0 272 104" preserveAspectRatio="none">
          <circle class="sun-body" cx="210" cy="35" r="16" />
          <circle class="sun-glow" cx="210" cy="35" r="28" />
          <path class="ridge-back" d="M0 104 L0 70 Q 60 50, 130 75 T 272 65 L 272 104 Z" />
          <path class="ridge-front" d="M0 104 L0 82 Q 80 65, 160 88 T 272 78 L 272 104 Z" />
        </svg>
      </div>

      <div class="sidebar-brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">درب</span>
          <span class="brand-tag">تنسيق الزيارات الميدانية</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-btn is-active" data-page="home" onclick="navigateTo('home')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1v-9"/></svg>
          <span>الرئيسية</span>
        </button>
        <button class="nav-btn" data-page="calendar" onclick="navigateTo('calendar')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          <span>التقويم</span>
        </button>
        <button class="nav-btn" data-page="archive" onclick="navigateTo('archive')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="14" rx="2"/><path d="M3 7l2-4h14l2 4M10 12h4"/></svg>
          <span>أرشيف الزيارات</span>
        </button>
        <button class="nav-btn" data-page="approval" onclick="navigateTo('approval')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6l8-4z"/><path d="M9 12l2 2 4-4"/></svg>
          <span>اعتماد التقارير</span>
          <span class="nav-badge" id="approvalBadge">0</span>
        </button>
        <button class="nav-btn" data-page="companies" onclick="navigateTo('companies')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16M9 7h1M14 7h1M9 11h1M14 11h1M9 15h1M14 15h1"/></svg>
          <span>دليل الشركات</span>
        </button>
        <button class="nav-btn" data-page="team" onclick="navigateTo('team')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          <span>إدارة الفريق</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="whoami">
          <label for="userRoleSelect">الصفة الحالية</label>
          <select id="userRoleSelect" onchange="switchRole(this.value)">
            <option value="lead">رئيس الفريق</option>
            <option value="member">عضو فريق</option>
            <option value="auditor">مراقب / مدقق</option>
          </select>
        </div>
        <div class="sync-pill">
          <span class="sync-dot"></span>
          <span>متزامن مع السحابة</span>
        </div>
      </div>
    </aside>

    <!-- منطقة المحتوى الرئيسية Main Column -->
    <div class="main-col">
      <header class="topbar">
        <div>
          <h1 class="topbar-title" id="pageTitle">الرئيسية</h1>
          <p class="topbar-sub" id="pageSubtitle">نظرة عامة على أداء الزيارات الميدانية للفريق</p>
        </div>
        <div class="topbar-actions">
          <div class="greeting-pill" id="greetingPill">مرحباً بك، مهندس</div>
          <button class="btn btn-primary" onclick="openNewVisitModal()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            زيارة جديدة
          </button>
        </div>
      </header>

      <!-- الصفحات التفاعلية -->
      <main class="page" id="page-home">
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
            <div class="kpi-value" id="kpiScheduled">0</div>
            <div class="kpi-label">زيارات مجدولة</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg></div>
            <div class="kpi-value" id="kpiCompleted">0</div>
            <div class="kpi-label">مكتملة هذا الشهر</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/></svg></div>
            <div class="kpi-value" id="kpiFactories">0</div>
            <div class="kpi-label">منشأة تم استهدافها</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">جدول الزيارات القادمة</span>
          </div>
          <div class="panel-body">
            <div class="table-wrap">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>كود الزيرة</th>
                    <th>التاريخ</th>
                    <th>المحافظة / الولاية</th>
                    <th>عدد المصانع</th>
                    <th>الحالة</th>
                    <th>الإجراءات</th>
                  </tr>
                </thead>
                <tbody id="visitsTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>

      <main class="page" id="page-calendar" hidden>
        <div class="panel">
          <div class="panel-body">
            <div id="calendarContainer"></div>
          </div>
        </div>
      </main>

      <main class="page" id="page-archive" hidden></main>
      <main class="page" id="page-approval" hidden></main>
      <main class="page" id="page-companies" hidden></main>
      <main class="page" id="page-team" hidden></main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
